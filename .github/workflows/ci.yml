name: CI

on:
  push:
    branches:
      - main
      - rizo
      - demotest
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore web project
        run: dotnet restore SchoolManagementSystem.Web.csproj

      - name: Restore tests
        run: dotnet restore Tests/SchoolManagementSystem.Web.Tests/SchoolManagementSystem.Web.Tests.csproj

      - name: Build
        run: dotnet build SchoolManagementSystem.Web.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Tests/SchoolManagementSystem.Web.Tests/SchoolManagementSystem.Web.Tests.csproj --configuration Release --no-restore --verbosity normal
